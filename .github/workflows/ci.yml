# CI is split by cost so pull-request feedback stays fast (AGENTS.md 54).
#
#   every PR       validate, secret scan, Android debug build
#   merge to main  the above, plus the iOS build
#   nightly        the above, plus release builds and generated-project
#                  validation
#
# macOS runners are billed at a multiple of Linux ones, which is why iOS does
# not run on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, so the slower checks run without blocking anyone.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege by default: the token can read the code and nothing else.
# A job needing more grants it to itself, so a widened scope is visible in the
# diff of the job that widened it (rule 23).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  changes:
    name: Detect template-surface changes
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.filter.outputs.template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        # A plain git diff rather than a marketplace filter action: one less
        # third-party dependency in the path that decides whether the
        # expensive check runs (rule 4).
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "template=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              | grep -qE '^(scripts/|android/|ios/|package\.json|\.github/workflows/)'; then
            echo "  changes touch the template surface"
            echo "template=true" >> "$GITHUB_OUTPUT"
          else
            echo "  no template-surface changes"
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage thresholds live in jest.config.js and fail the run on their
      # own; rule 49 forbids lowering them to make a build pass.
      - run: npm run test:coverage -- --ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action asks the API which commits a pull request contains, so
      # it scans what the PR adds rather than all of history. Without this the
      # request 403s and the action exits non-zero -- which reads as "a secret
      # was found" when it means "the token could not look".
      #
      # Read, not write: the action would also like to post findings as a PR
      # comment and logs a warning when it cannot. Findings still reach the
      # job summary and the SARIF artifact, which is enough, and a scanner
      # does not need permission to write to pull requests to do its job.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Development on every run; the release configuration only nightly,
        # where its extra minutes do not block a pull request.
        variant: ${{ github.event_name == 'schedule' && fromJSON('["DevelopmentDebug","ProductionRelease"]') || fromJSON('["DevelopmentDebug"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Free runner disk space
        # The first Android run failed with "No space left on device" partway
        # through the native build. A hosted runner has roughly 14 GB free,
        # and the New Architecture's C++ intermediates for several ABIs do not
        # fit beside the preinstalled toolchains. These three are not used by
        # any job here; the Android SDK and NDK are deliberately left alone.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - name: Build
        # One ABI on pull requests. The New Architecture compiles C++ per
        # architecture, so four ABIs is four times the build and four times
        # the disk for feedback nobody reads per-architecture. arm64-v8a is
        # also the only one the 16 KB check below inspects. The nightly run
        # builds every ABI, which is where that coverage belongs.
        run: |
          ./gradlew assemble${{ matrix.variant }} --no-daemon \
            ${{ github.event_name == 'schedule' && ' ' || '-PreactNativeArchitectures=arm64-v8a' }}
        working-directory: android
      - name: Verify 16 KB page-size alignment
        # Rule 34: every native dependency must be checked, not React Native
        # alone. A misaligned library crashes on Android 15 devices only.
        run: node scripts/check-16kb-alignment.js
        working-directory: .

  ios:
    name: iOS ${{ matrix.scheme }}
    # macOS runners are slow and metered, so this stays off pull requests.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Scheme and configuration travel together. Each scheme owns only the
        # configurations of its own environment, so pairing the development
        # scheme with Release would compile .env.production under it and build
        # something no one ever ships.
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"scheme":"TemplateProject Dev","configuration":"Debug"},{"scheme":"TemplateProject Production","configuration":"Release"}]') || fromJSON('[{"scheme":"TemplateProject Dev","configuration":"Debug"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: npm ci
      - name: Install pods
        run: bundle exec pod install --project-directory=ios
      - name: Build
        run: |
          xcodebuild \
            -workspace ios/TemplateProject.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration ${{ matrix.configuration }} \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build

  generated-project:
    name: Generated project builds
    # The check that actually proves the template works for a consumer
    # (AGENTS.md 55). It is a full install and Android build of a second copy,
    # so it does not run on every pull request -- but skipping it entirely is
    # how rename.js shipped leaving every Xcode scheme under its placeholder
    # name. A pull request that touches the renamer, either native project or
    # the workflow itself now pays for it.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    needs: [validate, changes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Generate a project
        # git archive copies the tracked tree without history, which is how
        # "Use this template" behaves and what rule 55 requires. The three
        # excluded files below are the ones the rename script also skips:
        # they document the template itself and keep their references.
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          git archive --format=tar HEAD | tar xf - -C "$RUNNER_TEMP/generated"
          cp .env.development .env.staging .env.production "$RUNNER_TEMP/generated/"

      - name: Rename it
        working-directory: ${{ runner.temp }}/generated
        run: node scripts/rename.js --name Acme --bundle-id com.acme.mobile --display-name "Acme Mobile"

      - name: No template-only references remain
        working-directory: ${{ runner.temp }}/generated
        run: |
          if grep -rIl "TemplateProject\|com\.templateproject" . \
              --exclude-dir=node_modules \
              --exclude=AGENTS.md --exclude=CLAUDE.md --exclude=README.md; then
            echo "Template-only references survived the rename (rule 55)."
            exit 1
          fi
          echo "None found."

      - name: Install
        working-directory: ${{ runner.temp }}/generated
        run: npm install

      - name: Validate
        working-directory: ${{ runner.temp }}/generated
        run: npm run validate

      - name: Build Android
        working-directory: ${{ runner.temp }}/generated/android
        run: ./gradlew assembleDevelopmentDebug --no-daemon
