# CI is split by cost so pull-request feedback stays fast (AGENTS.md 54).
#
#   every PR      install, typecheck, lint, tests, Android debug build
#   merge to main the above, plus the iOS build
#   release tag   the above, plus generated-project validation (added in Phase 8)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

  ios:
    name: iOS build
    # macOS runners are slow and metered, so this runs on main rather than on
    # every pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: npm ci
      - run: bundle exec pod install --project-directory=ios
      - name: Build
        run: |
          xcodebuild \
            -workspace ios/TemplateProject.xcworkspace \
            -scheme TemplateProject \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build
